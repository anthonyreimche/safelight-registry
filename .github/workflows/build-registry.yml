# Regenerates registry.json — the static catalog the SafeLight Extensions store
# loads from jsDelivr — on a schedule, on demand, when an extension repo reports
# a release or a merge, and whenever the curation lists or the generator change.
# See build-registry.mjs for what it produces.

name: Build registry index

on:
  schedule:
    # Every 15 minutes, off the top of the hour. GitHub delays or drops
    # scheduled runs under load, worst at minute 0: an "0 * * * *" schedule
    # ran only every 4 to 8 hours. A build is ~115 API calls, well inside the
    # Actions token's 1,000 an hour.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {} # manual "Run workflow" button
  # An extension repo's notify workflow, after a release or a push to its
  # default branch: POST /repos/anthonyreimche/safelight-registry/dispatches
  # with {"event_type": "extension-updated"}.
  repository_dispatch:
    types: [extension-updated]
  push:
    branches: [main]
    paths:
      - verified.json
      - banned.json
      - categories.json
      - category-overrides.json
      - deprecated.json
      - build-registry.mjs
      - apply-changes.mjs
      - store-fields.mjs
      - .github/workflows/build-registry.yml

# Allow the job to commit the regenerated registry.json back to the repo.
permissions:
  contents: write

# Never run two builds at once (a slow scrape + a scheduled tick could collide).
concurrency:
  group: build-registry
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Push back to PR-protected main as an admin (your PAT). The ruleset's
          # bypass list includes "Repository admin", so this identity bypasses the
          # "require pull request" rule that blocks the default GITHUB_TOKEN.
          # persist-credentials (default true) makes the later `git push` use it.
          token: ${{ secrets.REGISTRY_PUSH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build registry.json
        env:
          # The Actions token lifts the GitHub API budget to 5000/hr so a full
          # paginated rebuild + per-repo thumbnail resolution stays well within
          # limits. No extra secret needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node build-registry.mjs

      - name: Commit if changed
        run: |
          # Stage first, THEN check the staged diff — `git diff` alone ignores a
          # new untracked file, so the first build (registry.json doesn't exist in
          # the repo yet) would otherwise look "unchanged" and never commit.
          git add registry.json
          if git diff --cached --quiet; then
            echo "registry.json unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rebuild registry index"
          git push
